[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen3-mole"
version = "0.1.0"
description = "Prompt-routed mixture of LoRA experts on Qwen3-8B"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
train = [
  "accelerate>=1.2",
  "bitsandbytes>=0.45",
  "datasets>=3.2",
  "peft>=0.14",
  "safetensors>=0.4",
  "torch>=2.5",
  "transformers>=4.51",
]
test = ["pytest>=8.0"]

[project.scripts]
mole-prepare-data = "qwen3_mole.prepare_data:main"
mole-build-data = "qwen3_mole.build_data:main"
mole-build-eval = "qwen3_mole.build_eval:main"
mole-generate-semantic = "qwen3_mole.generate_semantic:main"
mole-score-semantic = "qwen3_mole.score_semantic:main"
mole-judge-systems = "qwen3_mole.judge_systems:main"
mole-review-agreement = "qwen3_mole.review_agreement:main"
mole-analyze-semantic = "qwen3_mole.analyze_semantic:main"
mole-train-router = "qwen3_mole.train_router:main"
mole-route = "qwen3_mole.route_prompts:main"
mole-train-expert = "qwen3_mole.train_expert:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
