project_name: qwen3-mole
base_model: Qwen/Qwen3-8B

domains:
  - code
  - math
  - systems
  - instruction

data:
  train_path: data/processed/train.jsonl
  validation_path: data/processed/validation.jsonl
  max_length: 1024

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  output_root: artifacts/adapters
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_ratio: 0.03
  num_train_epochs: 1.0
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  logging_steps: 10
  save_steps: 250
  eval_steps: 250
  seed: 42
  gradient_checkpointing: true
  max_grad_norm: 1.0

router:
  output_path: artifacts/router/router.joblib
  confidence_threshold: 0.55
  max_features: 50000
  ngram_min: 1
  ngram_max: 2
  c: 4.0
